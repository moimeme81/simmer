services:
  simmer:
    image: simmer:local
    build: .
    container_name: simmer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUID: "99"
      PGID: "100"
      # ANTHROPIC_API_KEY: ""      # optional: AI extraction for pages/videos without recipe markup
      TZ: America/Toronto
    volumes:
      - ./data:/data
